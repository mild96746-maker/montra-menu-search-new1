.primary{background:#111827;color:#fff}.green{background:#177245;color:#fff}.red{background:#b42318;color:#fff}.gray{background:#eef0f3;color:#222}
.search{margin-bottom:10px}
.count{color:#666;font-size:13px;margin:8px 2px}

</head>
<body>
<header>
<div class="wrap">
<h1>🍽️ Montra Menu Search – Admin</h1>
<div class="sub">จัดการข้อมูลเมนูด้วยตัวเอง • ข้อมูลบันทึกในอุปกรณ์นี้</div>
<div class="tabs">
<button id="viewTab" class="tab active" onclick="switchMode('view')">🔎 ค้นหาเมนู</button>
<button id="adminTab" class="tab" onclick="switchMode('admin')">⚙️ Admin</button>
</div>
</div>
</header>

<main class="wrap">
<section id="viewMode">
<div class="panel">
<input id="search" class="search" placeholder="ค้นหา เช่น ปูนิ่ม / กุ้ง / Pizza / Salmon">
<select id="cat"><option value="">📂 ทุกหมวดหมู่</option></select>
<div class="count" id="viewCount"></div>
</div>
<div id="viewGrid"></div>
</section>

<section id="adminMode" class="hidden">
<div class="note">
โหมด Admin ใช้สำหรับแก้ไขข้อมูลบนอุปกรณ์นี้โดยตรง ข้อมูลที่บันทึกจะอยู่ในเบราว์เซอร์ของเครื่องนี้
แนะนำให้กด “สำรองข้อมูล” เป็นระยะ เพื่อเก็บไฟล์ JSON ไว้
</div>

<div class="panel">
<h3 style="margin-top:0">เพิ่ม / แก้ไขเมนู</h3>
<input type="hidden" id="editIndex" value="-1">
<div class="row">
<div><label>ชื่อเมนูภาษาไทย</label><input id="th" placeholder="เช่น ปูนิ่มทอดกระเทียม"></div>
<div><label>ชื่อเมนูภาษาอังกฤษ</label><input id="en" placeholder="เช่น Deep Fried Soft Shell Crab with Garlic"></div>
<div><label>หมวดหมู่</label><input id="category" list="catList" placeholder="เช่น พิซซ่า — Pizza"><datalist id="catList"></datalist></div>
<div><label>ราคา (ใส่ได้หลายราคา เช่น 180 / 220)</label><input id="price" placeholder="390"></div>
</div>
<div class="actions">
<button class="primary" onclick="saveItem()">💾 บันทึกเมนู</button>
<button class="gray" onclick="clearForm()">ล้างฟอร์ม</button>
</div>
</div>

<div class="panel">
<input id="adminSearch" placeholder="ค้นหาเมนูที่ต้องการแก้ไข...">
<div class="count" id="adminCount"></div>
<div id="adminGrid"></div>
</div>

<div class="panel">
<h3 style="margin-top:0">สำรอง / กู้คืนข้อมูล</h3>
<div class="actions">
<button class="green" onclick="exportData()">⬇️ สำรองข้อมูล</button>
<button class="gray" onclick="document.getElementById('importFile').click()">⬆️ กู้คืนข้อมูล</button>
<button class="red" onclick="resetData()">↺ คืนค่าข้อมูลจาก PDF</button>
<input id="importFile" type="file" accept=".json" class="hidden" onchange="importData(event)">
</div>
</div>
</section>
</main>

let items = JSON.parse(localStorage.getItem('montraMenuData_20261002') || 'null') || JSON.parse(JSON.stringify(originalItems));

function persist(){localStorage.setItem('montraMenuData_20261002',JSON.stringify(items));}
function cats(){
  return [...new Set(items.map(x=>x.cat))].sort();
}
function setupCats(){
  const select=document.getElementById('cat');
  const current=select.value;
  select.innerHTML='<option value="">📂 ทุกหมวดหมู่</option>'+cats().map(c=>`<option>${esc(c)}</option>`).join('');
  if(cats().includes(current)) select.value=current;
  document.getElementById('catList').innerHTML=cats().map(c=>`<option value="${esc(c)}"></option>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

function switchMode(mode){
  const view=mode==='view';
  document.getElementById('viewMode').classList.toggle('hidden',!view);
  document.getElementById('adminMode').classList.toggle('hidden',view);
  document.getElementById('viewTab').classList.toggle('active',view);
  document.getElementById('adminTab').classList.toggle('active',!view);
  if(!view) renderAdmin();
  else renderView();
}

function renderView(){
  setupCats();
  const q=document.getElementById('search').value.trim().toLowerCase();
  const c=document.getElementById('cat').value;
  const out=items.filter(x=>(!c||x.cat===c)&&(!q||(x.th+' '+x.en).toLowerCase().includes(q)));
  document.getElementById('viewCount').textContent=out.length+' รายการ';
  document.getElementById('viewGrid').innerHTML=out.length?out.map(x=>`
    <article class="card"><div class="cat">${esc(x.cat)}</div><div class="name">${esc(x.th)}</div>
    <div class="en">${esc(x.en)}</div><div class="price">฿${esc(x.price)}</div></article>`).join('')
    :'<div class="empty">ไม่พบเมนูที่ค้นหา</div>';
}

function renderAdmin(){
  setupCats();
  const q=document.getElementById('adminSearch').value.trim().toLowerCase();
  const out=items.map((x,i)=>({...x,i})).filter(x=>(x.th+' '+x.en+' '+x.cat).toLowerCase().includes(q));
  document.getElementById('adminCount').textContent=out.length+' รายการ';
  document.getElementById('adminGrid').innerHTML=out.length?out.map(x=>`
    <article class="card"><div class="cardtop"><div>
    <div class="cat">${esc(x.cat)}</div><div class="name">${esc(x.th)}</div><div class="en">${esc(x.en)}</div><div class="price">฿${esc(x.price)}</div>
    </div><div class="actions">
    <button class="gray" onclick="editItem(${x.i})">✏️ แก้ไข</button>
    <button class="red" onclick="deleteItem(${x.i})">🗑️ ลบ</button></div></div></article>`).join('')
    :'<div class="empty">ไม่พบเมนู</div>';
}

function saveItem(){
  const th=document.getElementById('th').value.trim(), en=document.getElementById('en').value.trim();
  const cat=document.getElementById('category').value.trim(), price=document.getElementById('price').value.trim();
  if(!th||!en||!cat||!price){alert('กรุณากรอกข้อมูลให้ครบ');return;}
  const idx=Number(document.getElementById('editIndex').value);
  const obj={cat,th,en,price};
  if(idx>=0) items[idx]=obj; else items.push(obj);
  persist(); clearForm(); renderAdmin(); renderView();
  alert(idx>=0?'แก้ไขเมนูเรียบร้อยแล้ว':'เพิ่มเมนูเรียบร้อยแล้ว');
}
function editItem(i){
  const x=items[i];
  document.getElementById('editIndex').value=i;
  document.getElementById('th').value=x.th;
  document.getElementById('en').value=x.en;
  document.getElementById('category').value=x.cat;
  document.getElementById('price').value=x.price;
  window.scrollTo({top:0,behavior:'smooth'});
}
function clearForm(){
  document.getElementById('editIndex').value=-1;
  ['th','en','category','price'].forEach(id=>document.getElementById(id).value='');
}
function deleteItem(i){
  if(confirm('ต้องการลบเมนูนี้ใช่หรือไม่?')){
    items.splice(i,1);persist();renderAdmin();renderView();
  }
}
function exportData(){
  const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Montra_Menu_Backup.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(!Array.isArray(x))throw Error();
      items=x;persist();setupCats();renderAdmin();renderView();alert('กู้คืนข้อมูลเรียบร้อยแล้ว');
    }catch(err){alert('ไฟล์ JSON ไม่ถูกต้อง');}
  };r.readAsText(file);e.target.value='';
}
function resetData(){
  if(confirm('คืนค่าข้อมูลเริ่มต้นจาก PDF? การแก้ไขที่บันทึกไว้ในเครื่องนี้จะถูกแทนที่')){
    items=JSON.parse(JSON.stringify(originalItems));persist();renderAdmin();renderView();
  }
}
document.getElementById('search').addEventListener('input',renderView);
document.getElementById('cat').addEventListener('change',renderView);
document.getElementById('adminSearch').addEventListener('input',renderAdmin);
setupCats();renderView();
</script>
